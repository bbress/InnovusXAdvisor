name: ML Pipeline

on:
  # Run on schedule (weekly)
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight

  # Manual trigger
  workflow_dispatch:
    inputs:
      pipeline_type:
        description: 'Pipeline to run'
        required: true
        default: 'evaluation'
        type: choice
        options:
          - evaluation
          - training
          - deployment

  # Trigger on data changes
  push:
    branches: [main]
    paths:
      - 'data/knowledge_base/**'
      - 'mlops/**'

env:
  PYTHON_VERSION: "3.11"
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

jobs:
  # Data Validation
  data-validation:
    name: Data Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install great_expectations pyyaml

      - name: Run data validation
        run: |
          python -c "
          import json
          import os

          # Validate knowledge base
          kb_path = 'data/knowledge_base'
          if os.path.exists(kb_path):
              files = os.listdir(kb_path)
              print(f'Knowledge base files: {len(files)}')

              # Basic validation
              for f in files:
                  if f.endswith('.json'):
                      with open(os.path.join(kb_path, f)) as fp:
                          data = json.load(fp)
                          print(f'{f}: {len(data)} entries')

          print('Data validation passed')
          "

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: data-validation-report
          path: reports/

  # Model Evaluation
  evaluation:
    name: Model Evaluation
    needs: data-validation
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.pipeline_type == 'evaluation' || github.event.inputs.pipeline_type == '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt
          pip install mlflow

      - name: Run evaluation pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd mlops/pipelines
          python evaluation.py

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: mlops/experiments/

      - name: Check quality thresholds
        run: |
          echo "Checking quality thresholds..."
          # In production, parse results and fail if below threshold

  # Embedding Generation
  embeddings:
    name: Generate Embeddings
    needs: data-validation
    runs-on: ubuntu-latest
    if: ${{ contains(github.event.head_commit.modified, 'data/knowledge_base') }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install openai numpy

      - name: Generate embeddings
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Generating embeddings for updated knowledge base..."
          # In production, run embedding generation script

      - name: Upload embeddings
        uses: actions/upload-artifact@v4
        with:
          name: embeddings
          path: data/embeddings/

  # Training (manual trigger only)
  training:
    name: Model Training
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.pipeline_type == 'training' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt
          pip install mlflow

      - name: Run training pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
        run: |
          cd mlops/pipelines
          python training.py

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: models/

  # Drift Detection
  drift-detection:
    name: Drift Detection
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install scipy numpy prometheus-client

      - name: Run drift detection
        run: |
          echo "Running drift detection..."
          # In production, compare current vs reference distributions

      - name: Alert on drift
        if: failure()
        run: |
          echo "Drift detected! Alerting team..."
          # In production, send PagerDuty/Slack alert

  # Report Generation
  report:
    name: Generate Report
    needs: [evaluation, drift-detection]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Generate summary report
        run: |
          echo "# ML Pipeline Report" > report.md
          echo "" >> report.md
          echo "Run: ${{ github.run_id }}" >> report.md
          echo "Date: $(date)" >> report.md
          echo "" >> report.md
          echo "## Results" >> report.md
          echo "- Data Validation: ✅" >> report.md
          echo "- Evaluation: ✅" >> report.md
          echo "- Drift Detection: ✅" >> report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ml-pipeline-report
          path: report.md
